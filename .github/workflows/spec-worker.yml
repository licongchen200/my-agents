name: spec-worker

# Dispatched by the orchestrator for specs with Task type = backend. The spec body is
# passed in rather than fetched, so this runner never needs a Notion token.
on:
  workflow_dispatch:
    inputs:
      spec_url:
        description: Notion url of the spec
        required: true
        type: string
      spec_name:
        description: Spec title
        required: true
        type: string
      spec_body:
        description: The full spec, already fetched from Notion
        required: true
        type: string
      spec_project:
        description: Project this spec belongs to
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Create working branch
        run: |
          slug=$(printf '%s' "${{ inputs.spec_name }}" \
                 | tr '[:upper:]' '[:lower:]' \
                 | tr -cs 'a-z0-9' '-' \
                 | cut -c1-40 \
                 | sed 's/-*$//')
          branch="worker/${slug:-spec}"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          git checkout -b "$branch"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 40
          prompt: |
            You are a worker agent. Implement the specification below, end to end.

            Project: ${{ inputs.spec_project }}
            Spec: ${{ inputs.spec_name }}
            Source: ${{ inputs.spec_url }}

            You are already inside a fresh checkout on a new branch. Make the changes the
            spec calls for, directly in this working tree. Do not commit, do not push, and
            do not open a pull request — that is handled for you after you finish.

            If the spec is ambiguous, choose the smaller interpretation and note the
            assumption in your final message. If the spec cannot be done at all, change
            nothing and say why.

            --- SPECIFICATION ---
            ${{ inputs.spec_body }}
            --- END SPECIFICATION ---

      - name: Commit and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "orchestrator-worker"
          git config user.email "worker@licongchen.org"
          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::worker made no changes — treating as a failed attempt"
            exit 1
          fi
          git add -A
          git commit -m "${{ inputs.spec_name }}

          Implements ${{ inputs.spec_url }}

          Generated by a cloud worker session."
          git push -u origin "$BRANCH"
          gh pr create \
            --title "${{ inputs.spec_name }}" \
            --body "Implements [${{ inputs.spec_name }}](${{ inputs.spec_url }}).

          Project: ${{ inputs.spec_project }}

          Generated by a cloud worker session in GitHub Actions. Review before merging." \
            --head "$BRANCH"
